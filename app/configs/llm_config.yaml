llm:
  provider: "ollama"

ollama:
  base_url: "http://localhost:11434"
  model: "gemma4:e4b"
  temperature: 0.1
  max_tokens: 100
  timeout_seconds: 30

openai:
  api_key: "${OPENAI_API_KEY}"
  model: "gpt-3.5-turbo"
  temperature: 0.7
  max_tokens: 50
  timeout_seconds: 30

local:
  model_path: "models/sales_assistant-q4.gguf"
  n_ctx: 2048
  n_threads: 4
  n_gpu_layers: 0
  temperature: 0.6
  top_p: 0.9
  top_k: 40
  repeat_penalty: 1.1
  max_tokens: 50

analysis:
  context_size: 5
  min_interval_seconds: 20
  debounce_ms: 1000

cache:
  enabled: true
  max_size: 50
  ttl_seconds: 60
