suggestions:
  # Стратегия: "rules", "llm", "hybrid", "adaptive"
  strategy: "hybrid"

  # Приоритеты анализа
  priorities:
    - name: "objection" # возражения
      weight: 10
    - name: "interest" # признаки интереса
      weight: 8
    - name: "closing" # завершение сделки
      weight: 9
    - name: "questions" # вопросы клиента
      weight: 7

  # Правила для возражений
  objections:
    price:
      keywords:
        - "дорого"
        - "высокая цена"
        - "не по бюджету"
        - "дороговато"
        - "цена кусается"
        - "непомерно дорого"
      suggestions:
        - text: "Напомните про ROI и срок окупаемости"
          weight: 10
        - text: "Рассчитайте окупаемость инвестиций"
          weight: 8
        - text: "Предложите бонусы или скидку"
          weight: 6
        - text: "Обсудите что клиент получит за эту цену"
          weight: 7

    timing:
      keywords:
        - "подумаю"
        - "подумать"
        - "надо подумать"
        - "позже"
        - "не сейчас"
        - "через месяц"
        - "в следующем квартале"
      suggestions:
        - text: "Назначьте конкретную дату следующего звонка"
          weight: 9
        - text: "Спросите, что именно вызывает сомнения"
          weight: 8
        - text: "Отправьте дополнительные материалы для ознакомления"
          weight: 7

    existing_supplier:
      keywords:
        - "уже есть банк партнер"
        - "работаем с другим"
        - "есть банк"
        - "уже пользуемся"
        - "нас всё устраивает"
      suggestions:
        - text: "Спросите о текущих проблемах с банком"
          weight: 9
        - text: "Расскажите о ваших уникальных преимуществах"
          weight: 8
        - text: "Предложите сравнительный анализ"
          weight: 7

    no_money:
      keywords:
        - "нет денег"
        - "нет бюджета"
        - "нет средств"
        - "финансирование"
        - "кризис"
        - "тяжёлое положение"
      suggestions:
        - text: "Предложите рассрочку или тестовый период"
          weight: 10
        - text: "Покажите экономию в долгосрочной перспективе"
          weight: 9
        - text: "Сфокусируйтесь на минимизации затрат"
          weight: 8

  # Признаки интереса
  interest_signals:
    keywords:
      - "интересно"
      - "расскажите подробнее"
      - "как это работает"
      - "примеры"
      - "результаты"
      - "кейсы"
    suggestions:
      - text: "Углубитесь в конкретные преимущества"
        weight: 9
      - text: "Приведите пример успешного внедрения"
        weight: 8
      - text: "Предложите демо или пробный период"
        weight: 10

  # Вопросы клиента
  questions:
    keywords:
      - "сколько стоит"
      - "какая цена"
      - "стоимость"
      - "цена"
      - "в какую сумму"
    suggestions:
      - text: "Переходите к ценности, а не к цене"
        weight: 9
      - text: "Обсудите бюджет и ожидания"
        weight: 8
      - text: "Уточните, какой результат ожидает клиент"
        weight: 10

  # Дефолтные подсказки (если ничего не подошло)
  default:
    - "Спросите про боли и потребности бизнеса"
    - "Уточните текущие процессы"
    - "Предложите решение конкретной проблемы"
    - "Задайте открытый вопрос"
    - "Вернитесь к целям разговора"
    - "Какие критерии выбора для вас важны?"
    - "Что для вас идеальное решение?"
    - "С какими проблемами сталкиваетесь сейчас?"
    - "Кто ещё участвует в принятии решения?"
    - "Какие сроки рассматриваете?"
    - "Что должно быть в решении обязательно?"
    - "Расскажите о вашем текущем опыте"
    - "Как измеряете эффективность?"
    - "С чего хотите начать?"
    - "Какой бюджет закладываете?"
    - "Подведите итог по сказанному"
    - "Уточните, что именно не устраивает"
    - "Предложите конкретный следующий шаг"
    - "Назначьте встречу для демонстрации"
    - "Запросите контакты ЛПР"
    - "Спросите про текущие KPI"
    - "Узнайте про конкурентов"
    - "Обсудите выгоду для бизнеса"
    - "Переспросите, правильно ли поняли"
    - "Зафиксируйте договорённости"

  # Параметры выбора подсказки
  selection:
    method: "weighted_random" # weighted_random, highest_weight, round_robin
    fallback_to_default: true
    avoid_repetition: true
    repetition_penalty: 0.5
